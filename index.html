<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#faf8f5" />
  <title>노멀캐비넷 교동점 · 즉시 예약 안내</title>
  <meta name="description" content="노멀캐비넷 교동점 워크인 즉시 예약 — 오늘 밤 빈 방 확인 후 에어비앤비로 바로 예약. 한국어 / English / 中文." />
  <style>
    :root {
      --bg: #faf8f5;
      --card: #ffffff;
      --ink: #1c1917;
      --muted: #78716c;
      --line: #e7e5e4;
      --accent: #1c1917;
      --ok-bg: #ecfdf5;
      --ok-ink: #047857;
      --no-bg: #f5f5f4;
      --no-ink: #78716c;
      --airbnb: #ff385c;
      --notice-bg: #fff7ed;
      --notice-line: #fed7aa;
      --notice-ink: #9a3412;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR",
        "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.45;
    }
    .wrap {
      max-width: 520px;
      margin: 0 auto;
      padding: 18px 16px 44px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 14px;
    }
    .head-main { min-width: 0; }
    .brand-tag {
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
    }
    h1 {
      margin: 4px 0 4px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.25;
    }
    .addr {
      font-size: 13px;
      color: var(--muted);
      word-break: keep-all;
    }
    .lang-switch {
      display: flex;
      gap: 4px;
      background: #f0eeeb;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 3px;
      flex-shrink: 0;
    }
    .lang-btn {
      border: 0;
      background: transparent;
      color: var(--muted);
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      font-family: inherit;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .lang-btn.active {
      background: var(--accent);
      color: #fff;
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }
    .panel-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.02em;
      margin: 0 0 10px;
    }
    .steps {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      counter-reset: step;
    }
    .steps li {
      display: flex;
      gap: 9px;
      align-items: flex-start;
      font-size: 13px;
      line-height: 1.4;
    }
    .steps .num {
      flex-shrink: 0;
      width: 19px;
      height: 19px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 1px;
    }
    .steps b { font-weight: 700; }
    .date-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .field input[type="date"] {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 9px 10px;
      font-size: 14px;
      font-family: inherit;
      background: #fff;
      color: var(--ink);
    }
    .chips {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .chip {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }
    .chip.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .stays {
      font-size: 12px;
      color: var(--muted);
      margin-top: 9px;
    }
    .live-line {
      display: none;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
    }
    .live-line.on { display: flex; }
    .live-line .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--muted);
      flex: 0 0 auto;
    }
    .live-line.checking .dot { background: #d8a13a; animation: livePulse 1.1s infinite ease-in-out; }
    .live-line.ok .dot { background: var(--ok-ink); }
    .live-line.stale .dot { background: #c25b45; }
    @keyframes livePulse {
      0%, 100% { opacity: .3; }
      50% { opacity: 1; }
    }
    .summary-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      row-gap: 6px;
      gap: 10px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
      font-size: 13px;
    }
    .summary-count {
      flex: 1 1 auto;
      min-width: 0;
    }
    .summary-count strong {
      color: var(--ok-ink);
    }
    .toggle-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    .toggle-wrap input { margin: 0; }
    .floors {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }
    .floors::-webkit-scrollbar { display: none; }
    .floor-btn {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--muted);
      border-radius: 999px;
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      font-family: inherit;
    }
    .floor-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .room-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .room-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      transition: opacity 0.15s ease;
    }
    .room-card.booked {
      opacity: 0.55;
      background: #fafaf9;
    }
    .room-meta { min-width: 0; }
    .room-top {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 3px;
    }
    .room-num {
      font-size: 17px;
      font-weight: 700;
    }
    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .badge.ok { background: var(--ok-bg); color: var(--ok-ink); }
    .badge.no { background: var(--no-bg); color: var(--no-ink); }
    .room-sub {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .book-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      background: var(--airbnb);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 14px;
      border-radius: 10px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .book-btn.disabled {
      background: var(--line);
      color: var(--muted);
      pointer-events: none;
    }
    .empty-state {
      text-align: center;
      padding: 32px 16px;
      color: var(--muted);
      font-size: 14px;
      background: var(--card);
      border: 1px dashed var(--line);
      border-radius: 14px;
    }
    .notice {
      background: var(--notice-bg);
      border: 1px solid var(--notice-line);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 12.5px;
      color: var(--notice-ink);
      line-height: 1.45;
      margin-top: 12px;
    }
    .notice b { font-weight: 700; }
    footer {
      margin-top: 18px;
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      line-height: 1.6;
    }
    @media (max-width: 430px) {
      .brand-tag { font-size: 10px; letter-spacing: 0.04em; white-space: nowrap; }
      .lang-btn { padding: 5px 8px; font-size: 11.5px; }
      .chip { padding: 7px 10px; font-size: 12px; }
    }
    @media (max-width: 360px) {
      h1 { font-size: 20px; }
      .chip { font-size: 11.5px; padding: 6px 9px; }
    }
  </style>
</head>
<body>

        ],
        stays: (a, b, n) => `${a} → ${b} · ${n} night${n > 1 ? "s" : ""}`,

      zh: {

        pageTitle: "NORMAL CABINET 校洞店 · 自助入住预约",
        title: "NORMAL CABINET 校洞店",
        addr: "大邱市中区校洞2街 29-11 · 到店即可预约",
        stepsTitle: "使用方法",
        steps: [
          "<b>选择日期</b> — 今晚或明晚住1晚，一键即可选好。",

        ],

        bookBtn: "在爱彼迎预订",

        chips: [
          { id: "today1", label: "今晚1晚" },
          { id: "tomorrow1", label: "明晚1晚" },
          { id: "today2", label: "今天起2晚" }
        ],
        stays: (a, b, n) => `${a} → ${b} · ${n}晚`,
        summary: (ok, total) => `可订 <strong>${ok}</strong> / 共 ${total} 间`,
        empty: "所选日期没有空房。请更换日期，或关闭“只看空房”再试。",
        notice: "<b>预订后提示</b> — 门锁密码和入住说明会发送到您的爱彼迎消息。到店后按密码自助入住。",
        synced: (t) => `爱彼迎日历更新时间：${t}`,
        loading: "加载中...",
        liveChecking: "正在实时确认空房…",
        liveOk: "刚刚确认 · 实时爱彼迎日历",
        liveStale: "实时确认失败 · 显示已保存的日历",
        loadError: "无法加载房间信息，请稍后刷新页面。"
      }
    };

    const LOCALE = { ko: "ko-KR", en: "en-US", zh: "zh-CN" };

    // Cloudflare Worker 실시간 조회 엔드포인트. 비어 있으면 availability.json(정적)만 사용합니다.
    const LIVE_API_URL = "https://normal-cabinet-gyodong-ical.cderses.workers.dev/";

    let lang = "ko";
    let selectedFloor = "all";
    let rooms = [];
    let availability = { updated_at: "", rooms: {} };
    let loadError = false;
    let liveState = "off";
    let lastLiveAt = 0;
    let lastLiveTry = 0;
    // 실시간 조회가 끝나기 전에는 예약 버튼을 잠가 둡니다(엇갈린 안내 방지).
    let isCheckingLive = false;
    let liveCheckSeq = 0;

    function fmtDate(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function todayStr() {
      return fmtDate(new Date());
    }

    function addDays(dateStr, n) {
      const d = new Date(dateStr + "T00:00:00");
      d.setDate(d.getDate() + n);
      return fmtDate(d);
    }

    function diffDays(a, b) {
      const d1 = new Date(a + "T00:00:00");
      const d2 = new Date(b + "T00:00:00");
      return Math.max(1, Math.round((d2 - d1) / 86400000));
    }

    function prettyDate(dateStr) {
      if (!dateStr) return "-";
      const d = new Date(dateStr + "T00:00:00");
      if (isNaN(d.getTime())) return dateStr;
      try {
        return new Intl.DateTimeFormat(LOCALE[lang], { month: "short", day: "numeric", weekday: "short" }).format(d);
      } catch (e) {
        return dateStr;
      }
    }

    function isAvailable(listingId, checkIn, checkOut) {
      const info = (availability.rooms || {})[listingId];
      if (!info || !Array.isArray(info.blocked)) return true;
      for (const [s, e] of info.blocked) {
        if (checkIn < e && checkOut > s) return false;
      }
      return true;
    }

    function updateLiveLine() {
      const t = i18n[lang];
      const el = document.getElementById("liveStatus");
      const txt = document.getElementById("liveStatusText");
      if (!el || !txt) return;
      if (liveState === "off") {
        el.className = "live-line";
        txt.textContent = "";
        return;
      }
      el.className = "live-line on " + liveState;
      if (liveState === "checking") txt.textContent = t.liveChecking;
      else if (liveState === "ok") txt.textContent = t.liveOk;
      else txt.textContent = t.liveStale;
    }

    function setLiveState(state) {
      liveState = state;
      updateLiveLine();
    }

    // fresh=true 이면 Worker 의 20초 메모리 캐시를 건너뛰도록 ?fresh=1 을 붙입니다.
    async function refreshLive(fresh) {
      if (!LIVE_API_URL) {
        setLiveState("off");
        return;
      }
      const seq = ++liveCheckSeq;
      lastLiveTry = Date.now();
      isCheckingLive = true;
      setLiveState("checking");
      render(); // 실시간 확인 중에는 예약 버튼을 '확인 중…' 으로 잠급니다
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 8000);
      try {
        const sep = LIVE_API_URL.indexOf("?") === -1 ? "?" : "&";
        const qs = (fresh ? "fresh=1&" : "") + "t=" + Date.now();
        const res = await fetch(LIVE_API_URL + sep + qs, {
          cache: "no-store",
          signal: ctrl.signal
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        const ids = Object.keys((data && data.rooms) || {});
        if (!ids.length) throw new Error("empty payload");
        if (seq !== liveCheckSeq) return; // 더 새로운 조회가 시작됐으면 이 응답은 버립니다
        availability = { updated_at: data.updated_at || "", rooms: data.rooms };
        lastLiveAt = Date.now();
        setLiveState("ok");
      } catch (e) {
        if (seq === liveCheckSeq) setLiveState("stale");
      } finally {
        clearTimeout(timer);
        // 성공·실패(폴백) 어느 쪽이든 끝나는 즉시 버튼을 다시 엽니다.
        if (seq === liveCheckSeq) {
          isCheckingLive = false;
          render();
        }
      }
    }

    function detectLang() {
      const q = new URLSearchParams(window.location.search).get("lang");
      if (q && i18n[q]) return q;
      const nav = (navigator.language || "").toLowerCase();
      if (nav.startsWith("zh")) return "zh";
      if (nav.startsWith("en")) return "en";
      return "ko";
    }

    function setLang(next) {
      lang = i18n[next] ? next : "ko";
      const t = i18n[lang];
      document.documentElement.lang = t.htmlLang;
      document.title = t.pageTitle;
      document.querySelectorAll(".lang-btn").forEach((b) => {
        const on = b.dataset.lang === lang;
        b.classList.toggle("active", on);
        b.setAttribute("aria-pressed", on ? "true" : "false");
      });
      try {
        const u = new URL(window.location.href);
        u.searchParams.set("lang", lang);
        history.replaceState(null, "", u.toString());
      } catch (e) { /* file:// 등 */ }
      render();
    }

    function quickRange(id) {
      const today = todayStr();
      if (id === "today1") return [today, addDays(today, 1)];
      if (id === "tomorrow1") return [addDays(today, 1), addDays(today, 2)];
      if (id === "today2") return [today, addDays(today, 2)];
      return [today, addDays(today, 1)];
    }

    function activeQuickId(checkIn, checkOut) {
      const today = todayStr();
      const map = {
        today1: [today, addDays(today, 1)],
        tomorrow1: [addDays(today, 1), addDays(today, 2)],
        today2: [today, addDays(today, 2)]
      };
      for (const k of Object.keys(map)) {
        if (map[k][0] === checkIn && map[k][1] === checkOut) return k;
      }
      return null;
    }

    function renderChips() {
      const t = i18n[lang];
      const el = document.getElementById("quickChips");
      const checkIn = document.getElementById("checkIn").value;
      const checkOut = document.getElementById("checkOut").value;
      const active = activeQuickId(checkIn, checkOut);
      el.innerHTML = "";
      t.chips.forEach((c) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "chip" + (active === c.id ? " active" : "");
        b.textContent = c.label;
        b.onclick = () => {
          const [a, z] = quickRange(c.id);
          const ci = document.getElementById("checkIn");
          const co = document.getElementById("checkOut");
          ci.value = a;
          co.value = z;
          co.min = addDays(a, 1);
          render();
        };
        el.appendChild(b);
      });
    }

    function renderFloors() {
      const t = i18n[lang];
      const floors = ["all", 1, 2, 3, 4];
      const el = document.getElementById("floorTabs");
      el.innerHTML = "";
      floors.forEach((f) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "floor-btn" + (selectedFloor === f ? " active" : "");
        btn.textContent = f === "all" ? t.all : t.floor(f);
        btn.onclick = () => {
          selectedFloor = f;
          render();
        };
        el.appendChild(btn);
      });
    }

    function render() {
      const t = i18n[lang];
      document.getElementById("titleText").textContent = t.title;
      document.getElementById("addrText").textContent = t.addr;
      document.getElementById("checkInLabel").textContent = t.checkIn;
      document.getElementById("checkOutLabel").textContent = t.checkOut;
      document.getElementById("onlyAvailLabel").textContent = t.onlyAvail;
      document.getElementById("stepsTitle").textContent = t.stepsTitle;
      document.getElementById("stepsList").innerHTML = t.steps
        .map((s, i) => `<li><span class="num">${i + 1}</span><span>${s}</span></li>`)
        .join("");
      document.getElementById("noticeText").innerHTML = t.notice;
      updateLiveLine();

      renderChips();
      renderFloors();

      const checkIn = document.getElementById("checkIn").value || todayStr();
      const checkOut = document.getElementById("checkOut").value || addDays(checkIn, 1);
      const onlyAvail = document.getElementById("onlyAvail").checked;
      const nights = diffDays(checkIn, checkOut);
      document.getElementById("staysText").textContent = t.stays(prettyDate(checkIn), prettyDate(checkOut), nights);

      const floorRooms = rooms.filter((r) => selectedFloor === "all" || r.floor === selectedFloor);
      const enriched = floorRooms.map((r) => ({
        ...r,
        available: isAvailable(r.listing_id, checkIn, checkOut)
      }));

      const availCount = enriched.filter((r) => r.available).length;
      document.getElementById("summaryText").innerHTML = loadError
        ? t.loadError
        : t.summary(availCount, enriched.length);

      const visible = onlyAvail ? enriched.filter((r) => r.available) : enriched;
      const listEl = document.getElementById("roomList");
      listEl.innerHTML = "";

      if (visible.length === 0) {
        listEl.innerHTML = `<div class="empty-state">${loadError ? t.loadError : t.empty}</div>`;
      } else {
        visible.forEach((r) => {
          const card = document.createElement("div");
          card.className = "room-card" + (r.available ? "" : " booked");
          const bookUrl = `${r.room_url}?check_in=${encodeURIComponent(checkIn)}&check_out=${encodeURIComponent(checkOut)}`;
          const num = document.createElement("span");
          num.className = "room-num";
          num.textContent = r.room;
          const badge = document.createElement("span");
          badge.className = "badge " + (r.available ? "ok" : "no");
          badge.textContent = r.available ? t.avail : t.booked;

          const meta = document.createElement("div");
          meta.className = "room-meta";
          const top = document.createElement("div");
          top.className = "room-top";
          top.append(num, badge);
          const sub = document.createElement("div");
          sub.className = "room-sub";
          sub.textContent = t.roomSub(r.floor);
          meta.append(top, sub);

          const link = document.createElement("a");
          link.className = "book-btn" + (r.available && !isCheckingLive ? "" : " disabled");
          link.href = bookUrl;
          link.target = "_blank";
          link.rel = "noopener";
          link.textContent = isCheckingLive ? t.bookChecking : r.available ? t.bookBtn : t.bookedBtn;
          if (isCheckingLive) {
            link.removeAttribute("href");
            link.setAttribute("aria-disabled", "true");
            link.setAttribute("aria-busy", "true");
          } else if (!r.available) {
            link.removeAttribute("href");
            link.setAttribute("aria-disabled", "true");
          }

          card.append(meta, link);
          listEl.appendChild(card);
        });
      }

      const syncTime = availability.updated_at
        ? availability.updated_at.replace("T", " ").replace("+09:00", " KST")
        : "-";
      document.getElementById("syncFooter").textContent = t.synced(syncTime) + " · KR / EN / 中文";
    }

    async function init() {
      const today = todayStr();
      const checkInEl = document.getElementById("checkIn");
      const checkOutEl = document.getElementById("checkOut");
      checkInEl.min = today;
      checkInEl.value = today;
      checkOutEl.min = addDays(today, 1);
      checkOutEl.value = addDays(today, 1);

      checkInEl.addEventListener("change", () => {
        if (!checkInEl.value) checkInEl.value = today;
        if (checkOutEl.value <= checkInEl.value) {
          checkOutEl.value = addDays(checkInEl.value, 1);
        }
        checkOutEl.min = addDays(checkInEl.value, 1);
        render();
      });
      checkOutEl.addEventListener("change", () => {
        if (!checkOutEl.value) checkOutEl.value = addDays(checkInEl.value || today, 1);
        if (checkOutEl.value <= checkInEl.value) {
          checkOutEl.value = addDays(checkInEl.value, 1);
        }
        render();
      });
      document.getElementById("onlyAvail").addEventListener("change", render);
      document.querySelectorAll(".lang-btn").forEach((b) => {
        b.addEventListener("click", () => setLang(b.dataset.lang));
      });

      lang = detectLang();
      const t0 = i18n[lang];
      document.documentElement.lang = t0.htmlLang;
      document.title = t0.pageTitle;
      document.querySelectorAll(".lang-btn").forEach((b) => {
        const on = b.dataset.lang === lang;
        b.classList.toggle("active", on);
        b.setAttribute("aria-pressed", on ? "true" : "false");
      });
      render();

      try {
        const [rRes, aRes] = await Promise.all([
          fetch("./rooms.json", { cache: "no-store" }),
          fetch("./availability.json", { cache: "no-store" }).catch(() => null)
        ]);
        rooms = await rRes.json();
        if (aRes && aRes.ok) {
          availability = await aRes.json();
        }
        loadError = false;
      } catch (e) {
        rooms = [];
        loadError = true;
      }
      render();

      // 정적 availability.json 으로 먼저 그린 뒤, Worker 실시간 조회로 갱신
      // (새로고침으로 들어온 경우엔 캐시를 건너뛰고 ?fresh=1 로 조회)
      const navType = (performance.getEntriesByType("navigation")[0] || {}).type;
      refreshLive(navType === "reload");

      // 복귀·뒤로가기 캐시 복원 시에도 Worker 의 20초 캐시를 건너뜁니다(?fresh=1).
      window.addEventListener("pageshow", () => {
        if (!LIVE_API_URL) return;
        if (Date.now() - lastLiveTry < 3000) return;
        refreshLive(true);
      });
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState !== "visible" || !LIVE_API_URL) return;
        if (Date.now() - Math.max(lastLiveAt, lastLiveTry) > 3000) refreshLive(true);
      });
    }

    init();
  </script>
</body>
</html>
