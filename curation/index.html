<style>

    --ink-soft:#4B4842;
    --muted:#857F74;
    --line:rgba(26,26,26,.13);
    --line-soft:rgba(26,26,26,.07);
    --terra:#B4552F;
    --sage:#6F7D62;
    --sage-bg:#E8EBDD;
    --hdr:58px;
    --tabs:48px;
    --max:1100px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Helvetica Neue","Noto Sans KR","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.5;font-size:16px;

  img{display:block;max-width:100%}
  a{color:inherit}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

  /* ── header ── */
  .hdr{

    backdrop-filter:saturate(160%) blur(12px);-webkit-backdrop-filter:saturate(160%) blur(12px);
    border-bottom:1px solid var(--line-soft);
  }
  .mark{display:flex;flex-direction:column;line-height:.9;letter-spacing:-.045em;font-weight:800;font-size:14px;flex:none}
  .mark span{display:flex;align-items:flex-end}
  .mark i{display:inline-block;width:4px;height:4px;background:var(--ink);margin-left:2px;margin-bottom:2px}
  .hdr-sep{width:1px;height:18px;background:var(--line);flex:none}
  .hdr-title{font-size:13px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-soft)}
  .lang{margin-left:auto;display:flex;gap:2px;background:rgba(26,26,26,.055);border-radius:999px;padding:3px;flex:none}
  .lang button{padding:5px 9px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.02em;color:var(--muted);transition:.18s}
  .lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

  /* ── tabs ── */
  .tabs{
    position:sticky;top:var(--hdr);z-index:50;
    display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;
    padding:10px 18px;background:rgba(247,244,237,.95);
    backdrop-filter:saturate(160%) blur(12px);-webkit-backdrop-filter:saturate(160%) blur(12px);
    border-bottom:1px solid var(--line-soft);
  }
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    flex:none;padding:7px 13px;border-radius:999px;font-size:13px;font-weight:600;
    color:var(--ink-soft);border:1px solid var(--line);background:transparent;transition:.18s;white-space:nowrap;
  }
  .tab[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .tab .n{font-size:10.5px;opacity:.5;margin-left:4px;font-variant-numeric:tabular-nums}

  /* ── hero ── */
  .hero{padding:26px 0 0}
  .wrap{max-width:var(--max);margin:0 auto;padding:0 20px}
  .eyebrow{font-size:10.5px;letter-spacing:.19em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 14px}
  .hero h1{
    margin:0;font-size:clamp(38px,11.4vw,68px);line-height:.96;letter-spacing:-.05em;font-weight:800;
  }
  .hero h1 em{font-style:normal;color:var(--terra)}
  .lede{margin:16px 0 0;font-size:15px;line-height:1.62;color:var(--ink-soft);max-width:44ch}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0 0;padding:0;list-style:none}
  .chips li{font-size:11.5px;font-weight:700;letter-spacing:.01em;padding:5px 10px;border-radius:6px;background:rgba(26,26,26,.055);color:var(--ink-soft)}

  .hero-art img{width:100%;height:clamp(300px,58vh,520px);object-fit:cover;object-position:center 62%}
  .hero-art .art-cap{
    position:absolute;right:14px;bottom:12px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    color:#F7F4ED;background:rgba(26,26,26,.55);padding:4px 8px;border-radius:4px;backdrop-filter:blur(4px)
  }
  .base{
    display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;
    margin:0;padding:13px 20px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line-soft)
  }
  .base b{color:var(--ink);font-weight:700;font-size:12.5px}
  .base span{display:inline-flex;align-items:center;gap:5px}

  /* ── sections ── */
  .sec{padding:44px 0 6px;scroll-margin-top:calc(var(--hdr) + var(--tabs) + 8px)}
  .sec-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:20px}
  .sec-num{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--terra);padding-top:6px;flex:none;font-variant-numeric:tabular-nums}
  .sec-tt{flex:1;min-width:0}
  .sec-tt h2{margin:0;font-size:clamp(21px,5.6vw,28px);letter-spacing:-.035em;font-weight:800;line-height:1.15}
  .sec-tt p{margin:6px 0 0;font-size:13px;color:var(--muted);line-height:1.5}
  .sec-art{width:64px;height:64px;border-radius:12px;overflow:hidden;flex:none;background:#E9E2D6}
  .sec-art img{width:100%;height:100%;object-fit:cover}
  .sec-note{font-size:11.5px;color:var(--muted);margin:0 0 14px}

  .grid{display:grid;gap:12px;grid-template-columns:1fr}
  @media(min-width:640px){.grid{grid-template-columns:repeat(2,1fr);gap:14px}}
  @media(min-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}

  .card{
    position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:16px 16px 14px;display:flex;flex-direction:column;transition:transform .16s,border-color .16s,box-shadow .16s;
  }
  .card:hover{transform:translateY(-2px);border-color:rgba(26,26,26,.28);box-shadow:0 10px 26px -18px rgba(26,26,26,.5)}
  .card:focus-within{border-color:var(--ink)}
  .card-link{position:absolute;inset:0;border-radius:16px;z-index:1}
  .card-link:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .card-top{display:flex;align-items:center;gap:6px;margin-bottom:10px;min-height:20px}
  .badge{font-size:10px;font-weight:800;letter-spacing:.02em;padding:3px 7px;border-radius:4px;white-space:nowrap}
  .badge.f{background:var(--ink);color:var(--paper)}
  .badge.h{background:var(--sage-bg);color:#4E5B43}
  .badge.p{background:rgba(26,26,26,.06);color:var(--ink-soft)}
  .walk{margin-left:auto;font-size:11px;font-weight:700;color:var(--ink-soft);display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
  .walk svg{width:11px;height:11px;flex:none;opacity:.75}
  .card h3{margin:0 0 6px;font-size:17.5px;font-weight:750;letter-spacing:-.025em;line-height:1.28}
  .card .sub{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:600}
  .card p.desc{margin:0 0 11px;font-size:13.5px;line-height:1.56;color:var(--ink-soft)}
  .meta{display:flex;flex-direction:column;gap:3px;margin:0 0 10px;padding:9px 0 0;border-top:1px dashed var(--line-soft)}
  .meta .row{display:flex;gap:7px;font-size:11.5px;line-height:1.45}
  .meta .k{flex:none;width:30px;color:var(--muted);font-weight:700;letter-spacing:.02em;font-size:10px;padding-top:1px}
  .meta .v{color:var(--ink-soft)}
  .tip{font-size:11.5px;line-height:1.5;color:var(--terra);font-weight:600;margin:0 0 12px}
  .tip b{font-weight:800;letter-spacing:.08em;font-size:9.5px;vertical-align:1px;margin-right:4px}
  .maprow{display:flex;gap:6px;margin-top:auto;position:relative;z-index:2}
  .mapbtn{

    padding:8px 6px;border:1px solid var(--line);border-radius:9px;
    font-size:11.5px;font-weight:700;color:var(--ink-soft);text-decoration:none;transition:.16s;white-space:nowrap;

  .mapbtn svg{width:11px;height:11px;opacity:.7;flex:none}

  .routes{margin-top:52px;padding:38px 0 10px;border-top:1px solid var(--line)}

  .routes-art{margin:0 0 20px;overflow:hidden;border-radius:14px;background:#E9E2D6}
  .routes-art img{width:100%;height:clamp(140px,26vh,220px);object-fit:cover}
  .rgrid{display:grid;gap:12px;grid-template-columns:1fr}
  @media(min-width:860px){.rgrid{grid-template-columns:repeat(3,1fr)}}
  .route{background:var(--ink);color:var(--paper);border-radius:18px;padding:20px 18px;display:flex;flex-direction:column}

  .steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}

  .steps li:last-child{padding-bottom:0;border-left-color:transparent}

  .steps li:last-child::before{background:#F2C9A8}

  .steps .sn{font-size:12.5px;line-height:1.45;color:rgba(247,244,237,.94)}

  /* ── footer ── */
  .foot{margin-top:46px;border-top:1px solid var(--line);padding:26px 0 46px}
  .foot .brand{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:14px}
  .foot .mark{font-size:19px}
  .foot .mark i{width:5px;height:5px}
  .foot .est{font-size:9.5px;letter-spacing:.13em;color:var(--muted);text-align:right;line-height:1.5;text-transform:uppercase;font-weight:700}
  .foot .addr{font-size:12.5px;color:var(--ink-soft);margin:0 0 4px;font-weight:600}
  .foot .fine{font-size:11px;line-height:1.6;color:var(--muted);margin:10px 0 0;max-width:56ch}
  .foot .top{display:inline-block;margin-top:16px;font-size:11.5px;font-weight:700;color:var(--ink-soft);text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:2px}
  .hidden{display:none !important}
  @media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

      title: "大邱旅行策展 · normal cabinet. 校洞店",
      desc: "从校洞胡同走出去挑出的35处 — 本地美食、咖啡与酒吧、跑步路线、景点与夜景、附近便利，附距离、营业时间与地图链接。",
      hdrTitle: "大邱旅行策展",
      eyebrow: "DAEGU · GYODONG · CURATED 2026",
      h1: "在大邱的一天，<br><em>就这样。</em>",
      lede: "从校洞胡同走出去挑出的35处。从值得排队的招牌店到只有本地人知道的小酒吧——距离、营业时间与地图链接，一页搞定。",
      baseLabel: "出发点",
      baseAddr: "Normal Cabinet 校洞店 · 大邱中区校洞2街 29-11",
      baseNote: "中央路站、大邱站步行10分钟",
      chips: ["35处", "5个分类", "3条路线"],
      all: "全部", routes: "路线",
      tabFood: "美食", tabCafe: "咖啡酒吧", tabRun: "跑步散步", tabSpots: "景点展览", tabEss: "附近便利",
      badgeF: "人气名店", badgeH: "本地私藏", badgeP: "生活便利",
      hours: "时间", tip: "提示", naver: "Naver 地图", google: "Google Maps",
      count: "处", walkIcon: "移动",
      routesTitle: "推荐路线",
      routesSub: "每条路线都配上一家人气店、一两家本地私藏，以及一段走路或跑步的路。照着走可以，换个顺序也可以。",
      footAddr: "Normal Cabinet 校洞店 · 大邱中区校洞2街 29-11",
      footFine: "营业时间、休息日与价格以2026年11月16日地图信息为准。小店临时休息较多，建议当天在 Naver 地图或 Instagram 再确认一次。点击地图按钮会打开该地点的实际地图。",
      toTop: "回到顶部",
      openMap: "在地图中打开"
    }
  };

  var U = window.CURATION, lang = "ko", filter = "all";
  var $ = function(s, r){ return (r||document).querySelector(s); };
  var $$ = function(s, r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); };
  var esc = function(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); };

  var pin = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.1 7-11a7 7 0 1 0-14 0c0 4.9 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>';
  var foot = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 4.5a2 2 0 1 0 0 .01"/><path d="M9.5 21l1.7-5.2L9 13.6l1-4.6 3.2-1.6 2.4 3.1 2.9.7"/><path d="M10 9l-2.6 1.3L6 14"/></svg>';

  function naverUrl(p){ return "https://map.naver.com/p/search/" + encodeURIComponent(p.n.ko + " 대구"); }
  function googleUrl(p){ return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(p.n.ko + " " + p.a); }

  function setStatic(){
    var t = T[lang];
    document.documentElement.lang = lang === "zh" ? "zh-CN" : lang;
    document.title = t.title;
    var md = document.querySelector('meta[name="description"]'); if (md) md.setAttribute("content", t.desc);
    var og = document.querySelector('meta[property="og:title"]'); if (og) og.setAttribute("content", t.title);
    $$("[data-i18n]").forEach(function(el){ var k = el.getAttribute("data-i18n"); if (t[k] != null) el.textContent = t[k]; });
    $$("[data-i18n-html]").forEach(function(el){ var k = el.getAttribute("data-i18n-html"); if (t[k] != null) el.innerHTML = t[k]; });
    $("#chips").innerHTML = t.chips.map(function(c){ return "<li>" + esc(c) + "</li>"; }).join("");
  }

  function buildTabs(){
    var t = T[lang];
    var items = [
      { id: "all", label: t.all, n: U.places.length },
      { id: "food", label: t.tabFood, n: 8 },
      { id: "cafe", label: t.tabCafe, n: 7 },
      { id: "run", label: t.tabRun, n: 6 },
      { id: "spots", label: t.tabSpots, n: 8 },
      { id: "ess", label: t.tabEss, n: 6 },
      { id: "routes", label: t.routes, n: null }
    ];
    $("#tabs").innerHTML = items.map(function(it){
      return '<button type="button" class="tab" role="tab" data-filter="' + it.id + '" aria-selected="' + (filter === it.id) + '">' +
        esc(it.label) + (it.n != null ? '<span class="n">' + it.n + "</span>" : "") + "</button>";
    }).join("");
    $$("#tabs .tab").forEach(function(b){
      b.addEventListener("click", function(){
        filter = b.getAttribute("data-filter");
        $$("#tabs .tab").forEach(function(x){ x.setAttribute("aria-selected", String(x === b)); });
        b.scrollIntoView({ block: "nearest", inline: "center" });
        applyFilter(true);
      });
    });
  }

  function card(p){
    var t = T[lang];
    var badge = p.c === 5
      ? '<span class="badge p">' + esc(t.badgeP) + "</span>"
      : (p.b === "f" ? '<span class="badge f">' + esc(t.badgeF) + "</span>" : '<span class="badge h">' + esc(t.badgeH) + "</span>");
    return '<article class="card" data-cat="' + p.c + '">' +
      '<a class="card-link" href="' + esc(naverUrl(p)) + '" target="_blank" rel="noopener" aria-label="' + esc(p.n[lang] + " — " + t.openMap) + '"></a>' +
      '<div class="card-top">' + badge +
        '<span class="walk">' + foot + esc(p.w[lang]) + "</span></div>" +
      "<h3>" + esc(p.n[lang]) + "</h3>" +
      '<p class="sub">' + esc(typeof p.d === "string" ? p.d : p.d[lang]) + "</p>" +
      '<p class="desc">' + esc(p.s[lang]) + "</p>" +
      '<div class="meta">' +
        '<div class="row"><span class="k">' + esc(t.hours) + '</span><span class="v">' + esc(p.h[lang]) + "</span></div>" +
      "</div>" +
      '<p class="tip"><b>' + esc(t.tip) + "</b>" + esc(p.t[lang]) + "</p>" +
      '<div class="maprow">' +
        '<a class="mapbtn nv" href="' + esc(naverUrl(p)) + '" target="_blank" rel="noopener">' + pin + esc(t.naver) + "</a>" +
        '<a class="mapbtn" href="' + esc(googleUrl(p)) + '" target="_blank" rel="noopener">' + pin + esc(t.google) + "</a>" +
      "</div></article>";
  }

  function buildSections(){
    var t = T[lang], order = ["food","cafe","run","spots","ess"];
    var html = U.cats.map(function(c, i){
      var places = U.places.filter(function(p){ return p.c === c.id; });
      return '<section class="sec" id="cat-' + c.key + '" data-filter="' + order[i] + '">' +
        '<div class="wrap"><div class="sec-head">' +
          '<span class="sec-num">' + String(i + 1).padStart(2, "0") + "</span>" +
          '<div class="sec-tt"><h2>' + esc(c.title[lang]) + "</h2><p>" + esc(c.sub[lang]) + "</p></div>" +
          '<div class="sec-art"><img src="' + c.img + '" width="720" height="720" alt="" loading="lazy" /></div>' +
        "</div>" +
        '<div class="grid">' + places.map(card).join("") + "</div></div></section>";
    }).join("");
    $("#sections").innerHTML = html;
  }

  function buildRoutes(){
    var t = T[lang];
    $("#rgrid").innerHTML = U.routes.map(function(r){
      return '<article class="route">' +
        '<span class="rtag">' + esc(r.tag[lang]) + "</span>" +
        "<h3>" + esc(r.title[lang]) + "</h3>" +
        '<p class="rmeta">' + esc(r.meta[lang]) + "</p>" +
        '<ol class="steps">' + r.steps.map(function(s){
          return "<li><span class=\"st\">" + esc(s.t) + '</span><span class="sn">' + esc(s.n[lang]) + "</span></li>";
        }).join("") + "</ol></article>";
    }).join("");
  }

  function applyFilter(scroll){
    var showRoutes = filter === "routes";
    $$("#sections .sec").forEach(function(sec){
      sec.classList.toggle("hidden", filter !== "all" && sec.getAttribute("data-filter") !== filter);
    });
    var routes = $("#routes");
    routes.style.display = (filter === "all" || showRoutes) ? "" : "none";
    if (scroll && !showRoutes) {
      var first = $("#sections .sec:not(.hidden)");
      var y = (first ? first.getBoundingClientRect().top + window.pageYOffset : 0) - 118;
      window.scrollTo({ top: Math.max(0, y), behavior: "smooth" });
    }
  }

  function render(){
    setStatic(); buildTabs(); buildSections(); buildRoutes(); applyFilter(false);
    $$(".lang button").forEach(function(b){ b.setAttribute("aria-pressed", String(b.getAttribute("data-lang") === lang)); });
  }

  $$(".lang button").forEach(function(b){
    b.addEventListener("click", function(){
      lang = b.getAttribute("data-lang");
      try { localStorage.setItem("nc-curation-lang", lang); } catch(e){}
      render();
    });
  });

  try {
    var saved = localStorage.getItem("nc-curation-lang");
    if (saved && T[saved]) lang = saved;
  } catch(e){}
  var q = new URLSearchParams(location.search).get("lang");
  if (q && T[q]) lang = q;

  render();
  document.getElementById("top") || document.body.insertAdjacentHTML("afterbegin", '<span id="top"></span>');
})();
</script>
</body>
</html>
