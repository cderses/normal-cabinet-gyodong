name: Sync Airbnb iCal Availability

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "rooms.json"
      - "sync_ical.py"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync Airbnb iCal feeds
        env:
          GYODONG_ICAL_MAP: ${{ secrets.GYODONG_ICAL_MAP }}
        run: python3 sync_ical.py

      - name: Commit updated availability
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet availability.json; then
            git add availability.json
            git commit -m "chore: sync Airbnb iCal availability"
            git push
          else
            echo "No availability changes."
          fi
